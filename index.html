<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/lambda.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f5f3" />
    <!-- Apply the saved light/dark theme before first paint (no white flash).
         Keep the key in sync with src/settings/ThemeContext.tsx. -->
    <script>
      (function () {
        var t
        try {
          t = localStorage.getItem('sprtan.theme')
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = t
        if (t === 'dark') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0d1017')
        }
      })()
    </script>
    <meta name="description" content="Sprtan — catat progress angkat beban. Offline-first, disiplin ala Spartan." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sprtan" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded without blocking: a render-blocking third-party stylesheet also
         holds back the app's module script, so a slow or flaky connection
         (common mid-run) would stall startup. Text paints in the fallback font
         and swaps when these arrive (display=swap). -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Geist:wght@400..700&display=swap"
      onload="this.onload = null; this.rel = 'stylesheet'"
    />
    <title>Sprtan — Angkat. Catat. Taklukkan.</title>
    <!-- Google AdSense (Auto ads dikonfigurasi dari dashboard AdSense) -->
    <meta name="google-adsense-account" content="ca-pub-1557856769360345" />
    <!-- Hold ad requests when the app opens straight onto the run tracker.
         Keep in sync with src/lib/ads.ts. -->
    <script>
      if (location.hash.indexOf('#/run/track') === 0) {
        ;(window.adsbygoogle = window.adsbygoogle || []).pauseAdRequests = 1
      }
    </script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1557856769360345"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
